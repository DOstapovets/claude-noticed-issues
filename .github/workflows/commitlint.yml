name: Commit messages

# release-please reads the version from these, so a malformed one costs a release.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Reads commitlint.config.mjs, the action's default configFile.
      - uses: wagoid/commitlint-github-action@v6
